<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050508">
  <title>oceans-muse · 全栈博客已就绪</title>
  <style>
    :root {
      --bg: #050508;
      --ink: #f7f7fb;
      --ink-2: rgb(247 247 251 / .64);
      --ink-3: rgb(247 247 251 / .42);
      --line: rgb(255 255 255 / .1);
      --glass: linear-gradient(145deg, rgb(255 255 255 / .08), rgb(255 255 255 / .025));
      --accent: #a5c8ff;
      --font: "SF Pro Display", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100svh; display: grid; place-items: center; padding: 24px;
      color: var(--ink); font-family: var(--font); line-height: 1.6; overflow: hidden;
      background:
        radial-gradient(60% 50% at 30% 10%, rgb(75 110 240 / .28), transparent 65%),
        radial-gradient(50% 50% at 82% 86%, rgb(190 90 255 / .18), transparent 65%),
        radial-gradient(40% 40% at 10% 90%, rgb(40 220 235 / .12), transparent 65%),
        var(--bg);
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .5;
      background-image: linear-gradient(to right, var(--line) 1px, transparent 1px), linear-gradient(to bottom, var(--line) 1px, transparent 1px);
      background-size: 80px 80px;
      mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, #000, transparent 80%);
    }
    .card { position: relative; width: min(720px, 100%); padding: clamp(28px, 5vw, 52px); border-radius: 34px; background: var(--glass); border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgb(255 255 255 / .18), 0 50px 120px -40px #000; backdrop-filter: blur(30px) saturate(170%); }
    .brand { display: flex; align-items: center; gap: 13px; }
    .mark { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; background: conic-gradient(from 140deg, #7eb8ff, #bca4ff, #6ee7f2, #7eb8ff); box-shadow: inset 0 1px 0 #fff, 0 10px 28px -10px #6e9dff; }
    .mark svg { width: 22px; fill: #fff; }
    .brand b { display: block; font-size: 16px; letter-spacing: -.02em; }
    .brand small { color: var(--ink-3); font: 500 8px var(--mono); letter-spacing: .2em; text-transform: uppercase; }
    .eyebrow { margin-top: 40px; color: var(--ink-3); font: 500 9px var(--mono); letter-spacing: .24em; text-transform: uppercase; }
    h1 { margin-top: 13px; font-size: clamp(38px, 6.2vw, 62px); line-height: .98; letter-spacing: -.055em; font-weight: 640; }
    h1 em { font-style: normal; color: var(--accent); }
    p { max-width: 46ch; margin-top: 18px; color: var(--ink-2); font-size: 13.5px; }
    code { padding: 2px 7px; border-radius: 6px; background: rgb(255 255 255 / .07); border: 1px solid var(--line); font: 500 12px var(--mono); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
    .btn { display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 22px; border-radius: 999px; color: inherit; text-decoration: none; font: 600 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; background: rgb(255 255 255 / .07); border: 1px solid var(--line); transition: transform .25s cubic-bezier(.34,1.32,.64,1), background .25s; }
    .btn:hover { transform: translateY(-2px); background: rgb(255 255 255 / .13); }
    .btn--primary { background: #fff; color: #07070b; border-color: #fff; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 34px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--ink-3); font: 500 8px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
    .meta span { display: inline-flex; align-items: center; gap: 7px; }
    .dot { width: 5px; height: 5px; border-radius: 50%; background: #a8f0c6; box-shadow: 0 0 10px #a8f0c6; }
    .hint { margin-top: 18px; padding: 13px 15px; border-radius: 12px; background: rgb(255 255 255 / .035); border: 1px solid var(--line); color: var(--ink-3); font-size: 11px; }
    .hint b { color: var(--ink-2); font-weight: 500; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 1.2 14.34 9.66 22.8 12l-8.46 2.34L12 22.8 9.66 14.34 1.2 12l8.46-2.34z"/></svg></span>
      <span><b>oceans-muse</b><small>Liquid Glass Blog</small></span>
    </div>

    <p class="eyebrow">Full-stack · Ready</p>
    <h1>博客已经<br><em>进入轨道。</em></h1>
    <p>这是一个完整的 Node.js + SQLite 全栈站点。启动服务后，在浏览器中打开本地地址即可阅读、搜索、评论、订阅，并进入管理后台。</p>

    <div class="actions">
      <a class="btn btn--primary" href="http://127.0.0.1:4310/">打开博客 <span aria-hidden="true">↗</span></a>
      <a class="btn" href="http://127.0.0.1:4310/admin">进入工作台</a>
      <a class="btn" href="./README.md">查看文档</a>
    </div>

    <div class="hint"><b>尚未启动？</b> 在项目目录运行 <code>npm start</code>，然后访问 <code>http://127.0.0.1:4310</code>。初始账号 <code>admin</code> / <code>liquid-glass-2026</code>。</div>

    <div class="meta">
      <span><i class="dot"></i> Node + SQLite</span>
      <span>Zero dependencies</span>
      <span>Shanghai · 31.2304° N</span>
    </div>
  </main>
</body>
</html>
