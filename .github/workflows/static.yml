name: Deploy DEMO public static files
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Upload static assets from DEMO/public
        uses: actions/upload-pages-artifact@v3
        with:
          path: './DEMO/public'
      - name: Deploy to GitHub Pages
        id: deploy-step
        uses: actions/deploy-pages@v4
